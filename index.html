
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Vocabulary Quiz</title>

  <!-- Supabase JavaScript v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #6558e8;
      --primary-dark: #5145c7;
      --background: #f3f2ff;
      --white: #ffffff;
      --text: #24243a;
      --muted: #77778d;
      --border: #e4e3f1;
      --correct: #16855b;
      --correct-bg: #e6f7ef;
      --wrong: #c43e54;
      --wrong-bg: #fff0f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: var(--background);
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 540px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 29px;
      font-weight: 800;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(60, 50, 140, 0.08);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: bold;
    }

    .question-count {
      color: var(--primary);
    }

    .score-label {
      color: var(--muted);
    }

    .progress {
      height: 9px;
      background: #eceafa;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 34px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .question-label {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .word {
      text-align: center;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 800;
      color: var(--primary);
      overflow-wrap: anywhere;
      margin: 0 0 12px;
    }

    .instruction {
      text-align: center;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      padding: 17px 20px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: white;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .option:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f7f6ff;
    }

    .option:focus-visible,
    .main-button:focus-visible {
      outline: 3px solid #aaa3ff;
      outline-offset: 3px;
    }

    .option:disabled {
      cursor: default;
      opacity: 0.75;
    }

    .option.correct {
      background: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      opacity: 1;
    }

    .option.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
      opacity: 1;
    }

    .feedback {
      display: none;
      margin-top: 24px;
      padding: 18px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
    }

    .feedback.correct {
      display: block;
      background: var(--correct-bg);
      color: var(--correct);
    }

    .feedback.wrong {
      display: block;
      background: var(--wrong-bg);
      color: var(--wrong);
    }

    .feedback strong {
      display: block;
      margin-bottom: 4px;
      font-size: 17px;
    }

    .save-status {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .save-status.success {
      color: var(--correct);
    }

    .save-status.error {
      color: var(--wrong);
    }

    .main-button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-button:hover {
      background: var(--primary-dark);
    }

    .main-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .result {
      text-align: center;
    }

    .result-emoji {
      font-size: 55px;
      margin-bottom: 16px;
    }

    .result h2 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .final-score {
      margin: 25px 0;
      font-size: 64px;
      font-weight: 800;
      color: var(--primary);
    }

    .final-score span {
      font-size: 25px;
      color: var(--muted);
    }

    .result-message {
      color: var(--muted);
      line-height: 1.7;
    }

    .result-details {
      margin-top: 25px;
      text-align: left;
    }

    .result-item {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.6;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .result-item span {
      color: var(--muted);
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <h1>📚 Vocabulary Challenge</h1>
      <p>Choose the correct Korean meaning!</p>
    </header>

    <section class="card" id="quizScreen">
      <div class="top-row">
        <span class="question-count" id="questionCount">
          Question 1 / 3
        </span>
        <span class="score-label" id="scoreLabel">
          Score: 0
        </span>
      </div>

      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="question-label">
        What does this word mean?
      </div>

      <h2 class="word" id="englishWord"></h2>

      <p class="instruction">
        알맞은 뜻을 하나 선택하세요.
      </p>

      <div class="options" id="options"></div>

      <div
        class="feedback"
        id="feedback"
        aria-live="polite"
      ></div>

      <div
        class="save-status"
        id="saveStatus"
        role="status"
        aria-live="polite"
      ></div>

      <button
        type="button"
        class="main-button hidden"
        id="nextButton"
      >
        Next Question →
      </button>
    </section>

    <section class="card result hidden" id="resultScreen">
      <div class="result-emoji" id="resultEmoji">🎉</div>

      <h2>Quiz Completed!</h2>

      <p>최종 점수</p>

      <div class="final-score" id="finalScore"></div>

      <p class="result-message" id="resultMessage"></p>

      <div class="result-details" id="resultDetails"></div>

      <button
        type="button"
        class="main-button"
        id="restartButton"
      >
        🔄 다시 풀기
      </button>
    </section>

    <footer class="footer">
      HUFS GSE · W9 | GenAI + GitHub Pages + Supabase
      <div>개인정보를 수집하지 않는 익명 퀴즈</div>
    </footer>
  </main>

  <script>
    "use strict";

    // ==========================================
    // 1. Supabase 설정
    // 아래 두 값만 실제 프로젝트 값으로 교체하세요.
    // ==========================================

    const SUPABASE_URL = "https://emmnafglqvnmeiehlhud.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY ="sb_publishable_s5LUb2nPmwXhtZGkFye4Zw_hOCn3c3l";

    // ==========================================
    // 2. 퀴즈 문제
    // ==========================================

    const questions = [
      {
        question_no: 1,
        english_word: "abundant",
        options: [
          "조용한",
          "풍부한",
          "위험한",
          "느린"
        ],
        correct_answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: [
          "주저하는",
          "열정적인",
          "정확한",
          "부지런한"
        ],
        correct_answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: [
          "강력한",
          "평범한",
          "짧은",
          "불규칙한"
        ],
        correct_answer: "짧은"
      }
    ];

    // ==========================================
    // 3. Supabase 클라이언트 생성
    // ==========================================

    let supabaseClient = null;

    const hasConfig =
      SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
      SUPABASE_PUBLISHABLE_KEY !== "YOUR_PUBLISHABLE_KEY" &&
      SUPABASE_URL.trim() !== "" &&
      SUPABASE_PUBLISHABLE_KEY.trim() !== "";

    if (hasConfig) {
      try {
        if (!window.supabase) {
          throw new Error("Supabase CDN을 불러오지 못했습니다.");
        }

        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY,
          {
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false
            }
          }
        );
      } catch (error) {
        console.error("Supabase 초기화 실패:", error);
      }
    }

    // ==========================================
    // 4. 상태 변수
    // ==========================================

    let attemptId = null;
    let currentQuestionIndex = 0;
    let score = 0;
    let questionStartTime = 0;
    let answered = false;
    let answers = [];
    let attemptGeneration = 0;

    const quizScreen = document.getElementById("quizScreen");
    const resultScreen = document.getElementById("resultScreen");
    const questionCount = document.getElementById("questionCount");
    const scoreLabel = document.getElementById("scoreLabel");
    const progressFill = document.getElementById("progressFill");
    const englishWord = document.getElementById("englishWord");
    const optionsContainer = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const saveStatus = document.getElementById("saveStatus");
    const nextButton = document.getElementById("nextButton");
    const finalScore = document.getElementById("finalScore");
    const resultMessage = document.getElementById("resultMessage");
    const resultEmoji = document.getElementById("resultEmoji");
    const resultDetails = document.getElementById("resultDetails");
    const restartButton = document.getElementById("restartButton");

    // ==========================================
    // 5. 퀴즈 시작
    // ==========================================

    function startQuiz() {
      // 매번 새로운 응시 UUID 생성
      attemptId = crypto.randomUUID();

      // 이전 응시와 비동기 저장 결과를 구분
      attemptGeneration++;

      currentQuestionIndex = 0;
      score = 0;
      answered = false;
      answers = [];

      resultScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");

      showQuestion();
    }

    // ==========================================
    // 6. 문제 표시 및 시간 측정 시작
    // ==========================================

    function showQuestion() {
      answered = false;

      const question = questions[currentQuestionIndex];

      questionCount.textContent =
        `Question ${currentQuestionIndex + 1} / ${questions.length}`;

      scoreLabel.textContent = `Score: ${score}`;

      progressFill.style.width =
        `${(currentQuestionIndex / questions.length) * 100}%`;

      englishWord.textContent = question.english_word;

      optionsContainer.replaceChildren();

      feedback.className = "feedback";
      feedback.replaceChildren();

      saveStatus.className = "save-status";
      saveStatus.textContent = "";

      nextButton.classList.add("hidden");

      question.options.forEach((optionText, optionIndex) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "option";
        button.textContent =
          `${String.fromCharCode(65 + optionIndex)}. ${optionText}`;

        button.addEventListener("click", () => {
          chooseAnswer(optionText);
        });

        optionsContainer.appendChild(button);
      });

      // 실제 문제 표시 후 시간 측정 시작
      questionStartTime = performance.now();
    }

    // ==========================================
    // 7. 답변 선택
    // ==========================================

    function chooseAnswer(chosenAnswer) {
      // 이미 답했다면 추가 클릭 무시
      if (answered) {
        return;
      }

      // 첫 선택 순간에 응답 시간 확정
      const responseTimeMs = Math.max(
        0,
        Math.round(performance.now() - questionStartTime)
      );

      // 중복 선택 및 중복 INSERT 방지
      answered = true;

      const question = questions[currentQuestionIndex];

      const isCorrect =
        chosenAnswer === question.correct_answer;

      if (isCorrect) {
        score++;
      }

      // 현재 응시와 문제의 값을 고정
      const response = {
        attempt_id: attemptId,
        question_no: question.question_no,
        english_word: question.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: responseTimeMs
      };

      const answerRecord = {
        ...response,
        correct_answer: question.correct_answer,
        save_status: "saving"
      };

      answers.push(answerRecord);

      // 모든 보기 잠금 및 정오답 색상 표시
      const buttons = optionsContainer.querySelectorAll(".option");

      buttons.forEach((button, index) => {
        button.disabled = true;

        const optionText = question.options[index];

        if (optionText === question.correct_answer) {
          button.classList.add("correct");
        } else if (optionText === chosenAnswer) {
          button.classList.add("wrong");
        }
      });

      // 즉시 정오답 피드백
      feedback.className =
        isCorrect ? "feedback correct" : "feedback wrong";

      const feedbackTitle = document.createElement("strong");
      feedbackTitle.textContent =
        isCorrect ? "✅ Correct!" : "❌ Incorrect!";

      const feedbackDescription = document.createElement("div");
      feedbackDescription.textContent =
        `정답: ${question.correct_answer}`;

      const feedbackTime = document.createElement("div");
      feedbackTime.textContent =
        `응답 시간: ${(responseTimeMs / 1000).toFixed(2)}초`;

      feedback.replaceChildren(
        feedbackTitle,
        feedbackDescription,
        feedbackTime
      );

      scoreLabel.textContent = `Score: ${score}`;

      progressFill.style.width =
        `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

      // 다음 문제로 진행하는 버튼은 저장과 독립적으로 표시
      nextButton.textContent =
        currentQuestionIndex === questions.length - 1
          ? "See My Results →"
          : "Next Question →";

      nextButton.classList.remove("hidden");

      // INSERT는 선택 직후 정확히 한 번 호출
      // 비동기 저장 완료를 기다리지 않아도 다음 문제 진행 가능
      const generationAtSelection = attemptGeneration;

      void saveAnswer(
        response,
        answerRecord,
        generationAtSelection
      );
    }

    // ==========================================
    // 8. Supabase INSERT
    // ==========================================

    async function saveAnswer(
      response,
      answerRecord,
      generationAtSelection
    ) {
      const isCurrentQuestion = () =>
        generationAtSelection === attemptGeneration &&
        answers[currentQuestionIndex] === answerRecord &&
        !resultScreen.classList.contains("hidden");

      if (!supabaseClient) {
        answerRecord.save_status = "failed";

        if (isCurrentQuestion()) {
          saveStatus.className = "save-status error";
          saveStatus.textContent =
            "⚠️ Supabase 미연결: 저장되지 않았습니다.";
        }

        updateResultDetails();
        return;
      }

      if (isCurrentQuestion()) {
        saveStatus.className = "save-status";
        saveStatus.textContent = "⏳ 응답 저장 중...";
      }

      try {
        // INSERT 컬럼:
        // attempt_id
        // question_no
        // english_word
        // chosen_answer
        // is_correct
        // response_time_ms
        //
        // id와 created_at은 DB 기본값으로 자동 생성
        //
        // SELECT / UPDATE / DELETE 사용하지 않음
        // insert().select() 사용하지 않음

        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert([response]);

        if (error) {
          throw error;
        }

        answerRecord.save_status = "saved";

        if (isCurrentQuestion()) {
          saveStatus.className = "save-status success";
          saveStatus.textContent = "☁️ 응답 저장 완료";
        }

      } catch (error) {
        answerRecord.save_status = "failed";

        console.error("응답 저장 실패:", error);

        if (isCurrentQuestion()) {
          saveStatus.className = "save-status error";
          saveStatus.textContent =
            "⚠️ 저장 실패. 퀴즈는 계속 진행할 수 있습니다.";
        }
      }

      // 결과 화면이 열려 있으면 저장 상태 갱신
      updateResultDetails();
    }

    // ==========================================
    // 9. 다음 문제
    // ==========================================

    function nextQuestion() {
      if (!answered) {
        return;
      }

      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        showQuestion();
      } else {
        showResults();
      }
    }

    // ==========================================
    // 10. 최종 결과
    // ==========================================

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      finalScore.replaceChildren();

      const scoreText = document.createTextNode(String(score));
      const maxScore = document.createElement("span");

      maxScore.textContent = ` / ${questions.length}`;

      finalScore.append(scoreText, maxScore);

      if (score === 3) {
        resultEmoji.textContent = "🏆";
        resultMessage.textContent =
          "Perfect! 모든 단어를 정확하게 알고 있어요!";
      } else if (score === 2) {
        resultEmoji.textContent = "🌟";
        resultMessage.textContent =
          "Great job! 한 문제만 더 복습해 보세요.";
      } else if (score === 1) {
        resultEmoji.textContent = "📖";
        resultMessage.textContent =
          "Good try! 단어를 다시 살펴보세요.";
      } else {
        resultEmoji.textContent = "💪";
        resultMessage.textContent =
          "Keep practicing! 다시 도전해 보세요.";
      }

      updateResultDetails();
    }

    // ==========================================
    // 11. 응답별 결과 및 저장 상태
    // ==========================================

    function updateResultDetails() {
      if (resultScreen.classList.contains("hidden")) {
        return;
      }

      resultDetails.replaceChildren();

      answers.forEach((answer) => {
        const item = document.createElement("div");
        item.className = "result-item";

        const title = document.createElement("strong");
        title.textContent =
          `${answer.question_no}. ${answer.english_word} ` +
          (answer.is_correct ? "✅" : "❌");

        const detail = document.createElement("span");

        const seconds =
          (answer.response_time_ms / 1000).toFixed(2);

        let saveText;

        if (answer.save_status === "saved") {
          saveText = "저장 완료";
        } else if (answer.save_status === "failed") {
          saveText = "저장 실패";
        } else {
          saveText = "저장 중";
        }

        detail.textContent =
          `선택: ${answer.chosen_answer} | ` +
          `정답: ${answer.correct_answer} | ` +
          `${seconds}초 | ${saveText}`;

        item.append(title, detail);
        resultDetails.appendChild(item);
      });
    }

    // ==========================================
    // 12. 버튼 이벤트
    // ==========================================

    nextButton.addEventListener("click", nextQuestion);
    restartButton.addEventListener("click", startQuiz);

    // ==========================================
    // 13. 최초 실행
    // ==========================================

    try {
      startQuiz();
    } catch (error) {
      console.error("퀴즈 시작 실패:", error);

      quizScreen.replaceChildren();

      const message = document.createElement("p");
      message.textContent =
        "퀴즈를 시작할 수 없습니다. HTTPS 환경에서 실행해 주세요.";

      quizScreen.appendChild(message);
    }
  </script>
</body>
</html>
